name: Rust

on:
  push:
    branches: ["main", "dev", "rust*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: Quality (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sandbox test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-machete
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo nextest run --locked --no-tests=warn
      - name: Doc tests
        run: cargo test --doc --locked
      - name: Dependency policy
        run: cargo deny check
      - name: Unused dependencies
        run: cargo machete

  arch:
    name: Arch Linux (sandbox paths)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: System packages
        run: pacman -Syu --noconfirm --needed base-devel git rustup ripgrep bubblewrap util-linux
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup default stable
      - name: Trust checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Tests
        run: cargo test --locked
      - name: Packaging sanity
        run: |
          bash -n packaging/arch/PKGBUILD
          bash -c 'source packaging/arch/PKGBUILD && declare -F package build check prepare pkgver'
          command -v systemd-analyze >/dev/null || exit 0
          out=$(XDG_RUNTIME_DIR="$(mktemp -d)" systemd-analyze verify --user packaging/systemd/hermes-harness-health.service packaging/systemd/hermes-harness-health.timer 2>&1 || true)
          echo "$out"
          ! echo "$out" | grep -v -e 'is not executable' -e 'marked executable' | grep -q .

  debian:
    name: Debian (package)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      # dash forks children that outlive `sh`; without an init that reaps them, zombies keep
      # the process group alive and the watchdog timeout tests report cleanup_failed.
      options: --init
    steps:
      - name: System packages
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl build-essential git ripgrep bubblewrap util-linux python3
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Trust checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build package (runs the tests)
        run: bash packaging/debian/build-deb.sh "$RUNNER_TEMP"
      - name: Install and smoke test
        run: |
          apt-get install -y -qq --no-install-recommends "$RUNNER_TEMP"/hermes-harness_*.deb
          test "$(dpkg -L hermes-harness | grep -c '^/usr/bin/hermes-')" -eq 12
          hermes-skill-bridge doctor >/dev/null
          hermes-harness --help >/dev/null

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets --locked

  diff:
    name: Differential (Rust vs Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Differential tests
        run: HH_DIFF_PYTHON=python cargo test --locked --test differential -- --nocapture

  fuzz:
    name: Fuzz smoke (30s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run targets
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" -- -max_total_time=30 -max_len=4096
          done

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sandbox test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage summary
        run: cargo llvm-cov --locked --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
